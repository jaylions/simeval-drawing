<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    DEVELOPMENT FIXTURE ONLY - NOT AN OFFICIAL CAP/MTCI STIMULUS.

    Four abstract incomplete contours placed for interface development. They are
    intentionally not derived from, traced from, or validated against any
    published incomplete-shapes instrument. Replace this asset with the official
    stimulus set before collecting any analysable data.

    Drawn in the same near-black ink and stroke weight as participant marks, so
    the contours carry no colour, weight, or label cue that a participant could
    read as extra task information. Stroke width 6 matches the pencil default and
    survives the 224 px AuDrA scoring render as solid ink.
  -->
